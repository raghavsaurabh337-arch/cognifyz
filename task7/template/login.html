<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <script src="https://accounts.google.com/gsi/client" async></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .login-box {
            width: 350px;
            margin: 100px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        .or {
            text-align: center;
            margin: 20px 0;
            color: #777;
        }

        .google-login {
            display: flex;
            justify-content: center;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>Login</h2>

    <!-- Normal Django Login -->
    <form method="POST" action="/login/">
        {% csrf_token %}

        <input
            type="text"
            name="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>
    </form>

    <div class="or">
        OR
    </div>

    <!-- Google Login -->
    <div id="g_id_onload"
         data-client_id="YOUR_GOOGLE_CLIENT_ID"
         data-login_uri="http://127.0.0.1:8000/google-login/"
         data-auto_prompt="false">
    </div>

    <div class="google-login">
        <div class="g_id_signin"
             data-type="standard"
             data-size="large"
             data-theme="outline"
             data-text="signin_with"
             data-shape="rectangular"
             data-logo_alignment="left">
        </div>
    </div>
    <p>
     <a href="#">sing with google</a>
    </p>

</div>

</body>
</html>
